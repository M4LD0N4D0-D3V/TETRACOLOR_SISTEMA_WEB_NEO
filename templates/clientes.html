{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Directorio de Clientes</h2>
    <a href="/clientes/nuevo" class="btn btn-success">Nuevo Cliente</a>
</div>

<table class="table table-striped table-bordered">
    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Razón Social / Nombre</th>
            <th>Correo de Contacto</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for cliente in clientes %}
        <tr>
            <td>{{ cliente.id }}</td>
            <td>{{ cliente.nombre }}</td>
            <td>{{ cliente.correo }}</td>
            <td>
                <a href="/clientes/eliminar/{{ cliente.id }}" class="btn btn-danger btn-sm" onclick="return confirm('¿Eliminar este cliente? Se borrarán también sus pedidos.');">Eliminar</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
