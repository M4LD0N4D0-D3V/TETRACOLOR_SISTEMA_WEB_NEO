{% extends 'base.html' %}
{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="card shadow-lg border-0 rounded-4 text-center p-5" style="max-width: 600px;">
        <div class="mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" fill="#198754" class="bi bi-check-circle-fill" viewBox="0 0 16 16">
              <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
            </svg>
        </div>
        <h1 class="fw-bold text-dark mb-3">¡Tu pedido fue enviado con éxito!</h1>
        <p class="text-muted fs-5 mb-4">
            Tu cotización <strong>#{{ pedido_id }}</strong> ha sido registrada. Nuestro equipo de ventas se pondrá en contacto contigo muy pronto para confirmar los detalles.
        </p>
        <div>
            <a href="/" class="btn btn-tetra-green btn-lg fw-bold px-5 py-3">Seguir Comprando</a>
        </div>
    </div>
</div>
{% endblock %}
