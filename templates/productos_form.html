{% extends 'base.html' %}

{% block content %}
<div class="container py-4">
    <h2 class="fw-bold mb-3"><i class="bi bi-box-seam"></i> Añadir Nuevo Producto</h2>
    <form action="/productos/guardar" method="POST" enctype="multipart/form-data" class="shadow p-4 rounded-4 bg-light">
        <div class="mb-3">
            <label class="form-label fw-bold">Nombre del Producto</label>
            <input type="text" name="nombre_producto" class="form-control" required placeholder="Ej: Estampado Serigráfico">
        </div>
        
        <div class="mb-3">
            <label class="form-label fw-bold">Categoría</label>
            <select name="id_categoria" class="form-select" required>
                <option value="">Seleccione una categoría...</option>
                {% for cat in categorias %}
                    <option value="{{ cat.id }}">{{ cat.nombre }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Precio (S/)</label>
            <input type="number" step="0.01" name="precio" class="form-control" required placeholder="Ej: 45.50">
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Imagen del Producto</label>
            <input type="file" name="imagen" class="form-control" accept="image/*">
        </div>

        <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Guardar Producto</button>
        <a href="/productos" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
