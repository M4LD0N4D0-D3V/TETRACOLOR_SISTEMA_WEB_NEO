{% extends 'base.html' %}

{% block content %}
<h2>Añadir Nuevo Producto</h2>
<form action="/productos/guardar" method="POST" class="mt-4 shadow p-4 rounded bg-light">
    <div class="mb-3">
        <label class="form-label">Nombre del Producto</label>
        <input type="text" name="nombre_producto" class="form-control" required placeholder="Ej: Estampado Serigráfico">
    </div>
    <div class="mb-3">
        <label class="form-label">Precio (S/)</label>
        <input type="number" step="0.01" name="precio" class="form-control" required placeholder="Ej: 45.50">
    </div>
    <button type="submit" class="btn btn-primary">Guardar Producto</button>
    <a href="/productos" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
